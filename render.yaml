services:
  - type: web
    name: clauseguard-backend
    env: python
    branch: main
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.9.18
